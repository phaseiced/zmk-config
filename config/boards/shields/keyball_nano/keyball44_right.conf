CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Vendored Keyball PMW3360 driver (SROM upload + poll when no MOTION pin).
CONFIG_PMW3360=y
CONFIG_PMW3360_CPI=800
CONFIG_PMW3360_CPI_DIVIDOR=4
CONFIG_PMW3360_ORIENTATION_0=y
CONFIG_PMW3360_FORCE_AWAKE=y
CONFIG_PMW3360_SNIPE_CPI=400
CONFIG_PMW3360_SNIPE_CPI_DIVIDOR=4

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
