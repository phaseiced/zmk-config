CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Vendored Keyball PMW3360 driver (SROM upload + poll when no MOTION pin).
CONFIG_PMW3360=y
CONFIG_PMW3360_CPI=800
CONFIG_PMW3360_CPI_DIVIDOR=1
CONFIG_PMW3360_ORIENTATION_0=y
CONFIG_PMW3360_FORCE_AWAKE=y
# Match QMK Keyball / george-norton: get motion first, then optionally enable SROM.
CONFIG_PMW3360_UPLOAD_SROM=n
CONFIG_PMW3360_SNIPE_CPI=400
CONFIG_PMW3360_SNIPE_CPI_DIVIDOR=1
CONFIG_PMW3360_LOG_LEVEL_INF=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
