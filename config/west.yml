manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    # PMW3360 driver is vendored in-repo (modules/zmk-pmw3360-keyball) and
    # loaded via zephyr/module.yml + ZMK_EXTRA_MODULES (SROM + poll, no MOTION).
  self:
    path: config
